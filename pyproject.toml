[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferops"
version = "0.1.0"
description = "Modern Bare-Metal LLM Control Plane & Multi-Engine Inference Orchestrator (vLLM & SGLang)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alexandr Motologa", email = "alexandrmotologa@gmail.com" }
]
keywords = [
    "vllm",
    "sglang",
    "llm",
    "inference",
    "mlops",
    "control-plane",
    "gpu",
    "vram",
    "tui",
    "gateway"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.3",
    "rich>=13.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "textual>=0.85.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
inferops = "inferops.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/inferops"]

[tool.hatch.build.targets.wheel.force-include]
"src/inferops/py.typed" = "inferops/py.typed"
"src/inferops/web/static" = "inferops/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
